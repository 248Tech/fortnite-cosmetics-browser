name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile desktop app
        run: python -m py_compile fortnite_cosmetics_browser.pyw
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check web demo JavaScript
        run: node --check docs/app.js
