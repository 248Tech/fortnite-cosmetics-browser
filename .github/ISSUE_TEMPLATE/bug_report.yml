name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options: [Desktop app (Windows), Web demo, Both]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the Item Shop\n2. Click ...\n3. See ..."
  - type: input
    id: version
    attributes:
      label: Version / browser
      placeholder: "e.g. v1.0.0 on Windows 11, or Chrome 130"
